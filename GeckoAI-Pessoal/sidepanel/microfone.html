<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>GeckoAI — permitir o microfone</title>
  <link rel="stylesheet" href="fonts.css" />
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f1115;
      color: #e7e9ee;
      font-family: Geist, system-ui, -apple-system, Segoe UI, sans-serif;
      padding: 24px;
    }
    .cartao {
      max-width: 420px;
      text-align: center;
      background: #171a21;
      border: 1px solid #262b36;
      border-radius: 14px;
      padding: 28px 26px;
    }
    h1 { font-size: 18px; margin: 0 0 10px; }
    p { font-size: 14px; line-height: 1.55; color: #a8b0bf; margin: 0 0 8px; }
    /* Acento vem da marca (marca.css); o fallback é o verde do GeckoAI. */
    .ok { color: var(--accent, #b4f03d); }
    .erro { color: #f68b84; }
    button {
      margin-top: 16px;
      padding: 9px 18px;
      border-radius: 9px;
      border: none;
      background: var(--accent, #b4f03d);
      color: var(--accent-ink, #10130a);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }
  </style>
  <link rel="stylesheet" href="marca.css" />
</head>
<body>
  <div class="cartao">
    <h1>Permitir o microfone</h1>
    <p id="estado">Pedindo a permissão ao Chrome…</p>
    <p id="dica" hidden>
      Se não apareceu nada, clique no cadeado da barra de endereço e libere o
      microfone para esta extensão.
    </p>
    <button id="btn-tentar" hidden type="button">Tentar de novo</button>
  </div>
  <script type="module" src="microfone.js"></script>
</body>
</html>
